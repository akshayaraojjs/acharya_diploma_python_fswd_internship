{% extends 'academy/base.html' %}

{% block title %}{% if is_update %}Update{% else %}Add{% endif %} Course{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg">
            <div class="card-header p-4 text-center"
                style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; border-radius: 12px 12px 0 0;">
                <h3 class="mb-0">📚 {% if is_update %}Update{% else %}Add New{% endif %} Course</h3>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Course Title</label>
                        {{ form.name }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold">Description</label>
                        {{ form.description }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold">Course Fee ($)</label>
                        {{ form.fee }}
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-lg w-100 rounded-pill shadow"
                            style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; border: none;">
                            {% if is_update %}
                            Save Changes
                            {% else %}
                            Save Course
                            {% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
