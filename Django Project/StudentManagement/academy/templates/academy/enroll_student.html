{% extends 'academy/base.html' %}

{% block title %}Enroll Student{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg">
            <div class="card-header p-4 text-center"
                style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: white; border-radius: 12px 12px 0 0;">
                <h3 class="mb-0">📝 Enroll in Course</h3>
            </div>
            <div class="card-body p-4">
                <form method="post" action="{% url 'enroll_student' %}">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold">Select Student</label>
                        {{ form.student }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold">Select Course</label>
                        {{ form.course }}
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-lg w-100 rounded-pill shadow"
                            style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: white; border: none;">Confirm
                            Enrollment</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
